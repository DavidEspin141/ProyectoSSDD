<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LlamaChat - Chat IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f0f 100%);
            color: white;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar - Chats recientes */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .llama-logo-small {
            font-size: 2rem;
            background: #045eef;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(4, 94, 239, 0.4);
        }

        .app-name {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .text-blue {
            color: #045eef;
        }

        .sidebar h2 {
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .new-chat-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            background: #045eef;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(4, 94, 239, 0.3);
        }

        .new-chat-btn:hover {
            background: #034acb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(4, 94, 239, 0.4);
        }
        /* Estilo moderno para el botón de borrado SVG */
        .delete-btn {
            background: transparent; /* Fondo transparente total */
            border: none;
            cursor: pointer;
            padding: 8px; /* Un poco más de área de clic */
            border-radius: 10px;
            transition: all 0.3s ease; /* Transición suave */
            opacity: 0.6; /* Sutil por defecto */
            display: flex; /* Centrar el SVG */
            align-items: center;
            justify-content: center;
        }

        /* El icono SVG dentro del botón */
        .delete-btn svg {
            width: 18px; /* Tamaño elegante */
            height: 18px;
            fill: #b0b0b0; /* Color gris suave por defecto */
            transition: fill 0.3s ease;
        }

        /* Efectos al pasar el ratón (Hover) */
        .delete-btn:hover {
            background: rgba(255, 69, 58, 0.15); /* Fondo rojizo muy suave */
            opacity: 1; /* Brillo total */
            transform: scale(1.1); /* Ligeramente más grande */
            /* Resplandor rojo sutil (efecto neón) */
            box-shadow: 0 0 15px rgba(255, 69, 58, 0.4); 
        }

        /* Cambiar el color del icono SVG a rojo brillante al hover */
        .delete-btn:hover svg {
            fill: #ff453a; 
        }
        .chat-item {
            padding: 14px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #e0e0e0;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(4, 94, 239, 0.5);
            transform: translateX(5px);
        }

        .chat-item.active {
            background: rgba(4, 94, 239, 0.2);
            border-color: #045eef;
        }

        /* Panel principal de conversación */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
        }

        /* Decoración de fondo (blur blobs) */
        .blur-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(4, 94, 239, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        /* Ajuste del header para separar logo y botones */
        .chat-header {
            justify-content: space-between !important; /* Fuerza la separación */
            padding: 10px 30px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Estilo de los nuevos botones */
        .btn-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            background: rgba(4, 94, 239, 0.2);
            border-color: #045eef;
            transform: translateY(-2px);
        }

        .btn-logout:hover {
            background: rgba(255, 69, 58, 0.2); /* Color rojizo para salir */
            border-color: #ff453a;
        }

        /* Ocultar texto en pantallas pequeñas para que no se amontone */
        @media (max-width: 600px) {
            .btn-text {
                display: none;
            }
        }
        .chat-header {
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .chat-header .llama-logo-header {
            font-size: 2.5rem;
            background: #045eef;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(4, 94, 239, 0.5);
        }

        .chat-header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
            position: relative;
        }

        .message {
            display: flex;
            gap: 15px;
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: rgba(4, 94, 239, 0.15);
            border-color: rgba(4, 94, 239, 0.3);
            align-self: flex-end;
            max-width: 80%;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            max-width: 80%;
        }

        .message-icon {
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .message.user .message-icon {
            background: #045eef;
            box-shadow: 0 0 15px rgba(4, 94, 239, 0.4);
        }

        .message.assistant .message-icon {
            background: rgba(255, 255, 255, 0.1);
        }

        .message-content {
            color: #e0e0e0;
            line-height: 1.6;
            flex: 1;
        }

        .message-label {
            font-weight: bold;
            color: #045eef;
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* Área de input */
        .input-area {
            padding: 25px 30px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1;
        }

        .input-container {
            display: flex;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
            align-items: flex-end;
        }

        #message-input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 15px;
            resize: none;
            font-family: inherit;
            outline: none;
            max-height: 150px;
            transition: all 0.3s;
        }

        #message-input:focus {
            border-color: #045eef;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(4, 94, 239, 0.2);
        }

        #message-input::placeholder {
            color: #b0b0b0;
        }

        #send-button {
            padding: 15px 35px;
            background: #045eef;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(4, 94, 239, 0.3);
        }

        #send-button:hover {
            background: #034acb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(4, 94, 239, 0.4);
        }

        #send-button:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .empty-state .llama-logo {
            font-size: 5rem;
            background: #045eef;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(4, 94, 239, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .empty-state h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .empty-state p {
            font-size: 1.2rem;
            max-width: 500px;
            color: #b0b0b0;
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(4, 94, 239, 0.5);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(4, 94, 239, 0.7);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Sidebar: Chats recientes -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="llama-logo-small">🦙</div>
                <div class="app-name">
                    <span style="color: white;">Llama</span><span class="text-blue">Chat</span>
                </div>
            </div>

            <button class="new-chat-btn" onclick="newChat()">+ Nuevo Chat</button>

            <h2>Chats recientes</h2>
            <div id="recent-chats">
                <div style="color:#b0b0b0; font-size: 14px;">Cargando conversaciones...</div>
            </div>
        </div>

        <!-- Panel principal de conversación -->
        <div class="main-panel">
            <!-- Blur blobs decorativos -->
            <div class="blur-blob" style="top: 10%; left: 30%;"></div>
            <div class="blur-blob" style="bottom: 20%; right: 20%; background: rgba(0, 212, 255, 0.1);"></div>

            <div class="chat-header">
    <div class="header-brand">
        <a href="{{ url_for('index') }}" class="llama-logo-link" style="text-decoration: none;">
            <div class="llama-logo-header">🦙</div>
        </a>
        <h1>
            <span style="color: white;">Llama</span><span class="text-blue">Chat</span>
        </h1>
    </div>

    <div class="header-actions">
        <a href="{{ url_for('profile') }}" class="btn-icon" title="Mi Perfil">
            👤 <span class="btn-text">Perfil</span>
        </a>
        <a href="{{ url_for('logout') }}" class="btn-icon btn-logout" title="Cerrar Sesión">
            🚪 <span class="btn-text">Salir</span>
        </a>
    </div>
</div>

            <div class="chat-messages" id="chat-messages">
                <div class="empty-state">
                    <div class="llama-logo">🦙</div>
                    <h1>
                        <span style="color: white;">Llama</span><span class="text-blue">Chat</span>
                    </h1>
                    <p>El siguiente nivel de los Machine Learning. ¿En qué puedo ayudarte hoy?</p>
                </div>
            </div>

            <!-- Input de texto + botón -->
            <div class="input-area">
                <div class="input-container">
                    <textarea id="message-input" placeholder="Introducir texto..." rows="1"
                        onkeypress="handleKeyPress(event)" oninput="autoResize(this)"></textarea>
                    <button id="send-button" onclick="sendMessage()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let dialogueId = null; // mantenemos conversación actual en el cliente

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        // helper: muestra/borra empty state
        function ensureNotEmptyState() {
            const chatMessages = document.getElementById('chat-messages');
            const emptyState = chatMessages.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
        }

        function setSendingState(isSending) {
            const sendButton = document.getElementById('send-button');
            sendButton.disabled = isSending;
            sendButton.textContent = isSending ? 'Procesando...' : 'Enviar';
        }

        function addMessage(type, content) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const label = type === 'user' ? 'Tú' : 'LlamaChat';
            const icon = type === 'user' ? '👤' : '🦙';

            messageDiv.innerHTML = `
                <div class="message-icon">${icon}</div>
                <div class="message-content">
                    <div class="message-label">${label}</div>
                    <div>${escapeHtml(content)}</div>
                </div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // evitar inyección HTML
        function escapeHtml(str) {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const messageText = input.value.trim();
            if (!messageText) return;

            ensureNotEmptyState();
            addMessage('user', messageText);

            input.value = '';
            input.style.height = 'auto';

            setSendingState(true);

            try {
                const res = await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: messageText,
                        dialogue_id: dialogueId
                    })
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    const err = data.error || 'Error desconocido llamando a /send';
                    addMessage('assistant', `[ERROR] ${err}`);
                    return;
                }

                // actualizar dialogueId si viene
                if (data.dialogue_id) {
                    dialogueId = data.dialogue_id;
                }

                // Si se acaba de crear conversación (o cambió), refrescamos sidebar y marcamos activo
                await loadConversations();
                markActiveConversation(dialogueId);

                // mostrar respuesta: preferimos data.response, si no, algo razonable
                const reply = data.response || '(sin respuesta del backend)';
                addMessage('assistant', reply);

            } catch (e) {
                addMessage('assistant', `[ERROR] No se pudo contactar con el servidor: ${e}`);
            } finally {
                setSendingState(false);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function newChat() {
            // reset cliente
            dialogueId = null;

            // reset servidor (si implementas /chat/reset)
            try { await fetch('/chat/reset', { method: 'POST' }); } catch (_) { }

            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = `
                <div class="empty-state">
                    <div class="llama-logo">🦙</div>
                    <h1>
                        <span style="color: white;">Llama</span><span class="text-blue">Chat</span>
                    </h1>
                    <p>El siguiente nivel de los Machine Learning. ¿En qué puedo ayudarte hoy?</p>
                </div>
            `;

            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            await loadConversations();
        }

        // -------------------------------
        // Sidebar: conversaciones reales
        // -------------------------------

        async function loadConversations() {
            const container = document.getElementById('recent-chats');
            container.innerHTML = `<div style="color:#b0b0b0; font-size: 14px;">Cargando conversaciones...</div>`;

            try {
                const res = await fetch('/api/chats', { method: 'GET' });
                const data = await res.json().catch(() => ([]));

                if (!res.ok) {
                    const err = (data && data.error) ? data.error : 'Error cargando /api/chats';
                    container.innerHTML = `<div style="color:#ffb3b3; font-size: 14px;">${escapeHtml(err)}</div>`;
                    return;
                }

                // data debe ser array de Conversation
                renderConversationList(Array.isArray(data) ? data : []);
            } catch (e) {
                container.innerHTML = `<div style="color:#ffb3b3; font-size: 14px;">No se pudo contactar con el servidor: ${escapeHtml(e)}</div>`;
            }
        }

        function renderConversationList(conversations) {
            const container = document.getElementById('recent-chats');

            if (!conversations.length) {
                container.innerHTML = `<div style="color:#b0b0b0; font-size: 14px;">No hay conversaciones previas.</div>`;
                return;
            }

            container.innerHTML = '';

            for (const conv of conversations) {
                const id = conv.dialogueId || conv.dialogue_id; 
                const dialogueIdValue = id;

                const item = document.createElement('div');
                item.className = 'chat-item';
                item.dataset.dialogueId = dialogueIdValue;
                
                // Estilo flex para que el texto y el botón vivan juntos
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';

                // Generar título
                let title = `Chat ${String(dialogueIdValue).slice(0, 8)}`;
                const dialogues = conv.dialogue || [];
                if (Array.isArray(dialogues) && dialogues.length) {
                    const last = dialogues[dialogues.length - 1];
                    if (last && last.prompt) {
                        title = last.prompt.length > 20 ? (last.prompt.slice(0, 20) + '...') : last.prompt;
                    }
                }

                item.innerHTML = `
                    <span class="chat-title" style="flex:1" onclick="openConversation('${dialogueIdValue}', this.parentElement)">${escapeHtml(title)}</span>
                    <button class="delete-btn" onclick="deleteChat('${dialogueIdValue}', event)" title="Eliminar Chat">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6v18h18v-18h-18zm5 14c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1-.448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1-.448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1-.448 1 1v10zm4-18v2h-20v-2h5.711c.9 0 1.631-1.099 1.631-2h5.316c0 .901.73 2 1.631 2h5.711z"/>
                        </svg>
                    </button>
                `;

                container.appendChild(item);
            }
        }

        // Activa visualmente el item + carga la conversación (para mensajes)
        async function openConversation(selectedDialogueId, clickedElement) {
            // activar estilos
            document.querySelectorAll('#recent-chats .chat-item').forEach(i => i.classList.remove('active'));
            if (clickedElement) clickedElement.classList.add('active');

            dialogueId = selectedDialogueId;

            // Cargar mensajes y pintarlos:
            await loadConversationMessages(selectedDialogueId);
        }

        // Carga una conversación completa y renderiza los mensajes en pantalla
        async function loadConversationMessages(selectedDialogueId) {
            try {
                const res = await fetch(`/api/chats/${encodeURIComponent(selectedDialogueId)}`, { method: 'GET' });
                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    const err = data.error || 'Error cargando conversación';
                    addMessage('assistant', `[ERROR] ${err}`);
                    return;
                }

                // data es Conversation con data.dialogue
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = ''; // limpia el panel
                ensureNotEmptyState(); // (si no hay empty-state ya no hace nada)

                const history = Array.isArray(data.dialogue) ? data.dialogue : [];
                if (!history.length) {
                    chatMessages.innerHTML = `
                <div class="empty-state">
                    <div class="llama-logo">🦙</div>
                    <h1>
                        <span style="color: white;">Llama</span><span class="text-blue">Chat</span>
                    </h1>
                    <p>Esta conversación no tiene mensajes todavía.</p>
                </div>
            `;
                    return;
                }

                for (const d of history) {
                    if (d.prompt) addMessage('user', d.prompt);
                    if (d.response) addMessage('assistant', d.response);
                }
            } catch (e) {
                addMessage('assistant', `[ERROR] No se pudo contactar con el servidor: ${e}`);
            }
        }

        // Cargar conversaciones al abrir la página
        document.addEventListener('DOMContentLoaded', async () => {
            // Resetea el chat activo guardado en sesión (para empezar limpio al entrar)
            try { await fetch('/chat/reset', { method: 'POST' }); } catch (_) { }

            // Limpia también el estado en el cliente
            dialogueId = null;

            // Carga sidebar
            await loadConversations();
        });

        function markActiveConversation(id) {
            if (!id) return;
            document.querySelectorAll('#recent-chats .chat-item').forEach(i => {
                i.classList.toggle('active', i.dataset.dialogueId === id);
            });
        }

        // Función para eliminar un chat de la lista y la base de datos
        async function deleteChat(id, event) {
            event.stopPropagation();
            
            if (!confirm('¿Estás seguro de que quieres eliminar esta conversación definitivamente?')) return;

            // Capturamos la caja exacta del HTML que el usuario ha clicado
            const chatElement = event.currentTarget.closest('.chat-item');

            try {
                const res = await fetch(`/api/chats/${encodeURIComponent(id)}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    // 1. Hacemos desaparecer el chat visualmente al instante
                    if (chatElement) {
                        chatElement.remove();
                    }

                    // 2. Si el chat borrado es el que está en pantalla, limpiamos 
                    // el panel a mano para no recargar la lista antigua
                    if (dialogueId === id) {
                        dialogueId = null;
                        try { await fetch('/chat/reset', { method: 'POST' }); } catch (_) {}
                        
                        document.getElementById('chat-messages').innerHTML = `
                            <div class="empty-state">
                                <div class="llama-logo">🦙</div>
                                <h1><span style="color: white;">Llama</span><span class="text-blue">Chat</span></h1>
                                <p>El siguiente nivel de los Machine Learning. ¿En qué puedo ayudarte hoy?</p>
                            </div>
                        `;
                    }
                } else {
                    alert('Error: El servidor no pudo borrar el chat.');
                }
            } catch (e) {
                console.error("Error en la petición DELETE:", e);
                alert("Hubo un error de conexión al intentar borrar el chat.");
            }
        }
    </script>

{% extends "base.html" %}

{% block custom_style %}
<style>
    body {
        background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f0f 100%);
        color: white;
        min-height: 100vh;
    }

    .profile-container {
        max-width: 800px;
        margin: 80px auto;
        padding: 20px;
    }

    /* Tarjeta principal con efecto cristal */
    .profile-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
    }

    /* Círculo de Avatar */
    .avatar-circle {
        width: 120px;
        height: 120px;
        background: #045eef;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        font-weight: bold;
        margin: 0 auto 20px;
        box-shadow: 0 0 30px rgba(4, 94, 239, 0.5);
    }

    .profile-name {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 5px;
    }

    .profile-email {
        color: #b0b0b0;
        font-size: 1.1rem;
        margin-bottom: 30px;
    }

    /* Detalles de la cuenta */
    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        text-align: left;
        margin-bottom: 40px;
    }

    .info-item {
        background: rgba(255, 255, 255, 0.03);
        padding: 20px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-label {
        font-size: 0.8rem;
        color: #045eef;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .info-value {
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        word-break: break-all;
    }

    /* Botones de acción */
    .profile-actions {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .btn-action {
        padding: 12px 30px;
        border-radius: 12px;
        font-weight: bold;
        text-decoration: none;
        transition: all 0.3s;
    }

    .btn-chat {
        background: #045eef;
        color: white;
    }

    .btn-chat:hover {
        background: #034acb;
        transform: translateY(-3px);
    }

    .btn-logout {
        background: rgba(255, 69, 58, 0.1);
        color: #ff453a;
        border: 1px solid rgba(255, 69, 58, 0.3);
    }

    .btn-logout:hover {
        background: rgba(255, 69, 58, 0.2);
    }

    /* Blobs de fondo decorativos */
    .blur-blob {
        position: absolute;
        width: 250px;
        height: 250px;
        background: rgba(4, 94, 239, 0.15);
        filter: blur(80px);
        border-radius: 50%;
        z-index: -1;
    }
</style>
{% endblock %}

{% block content %}
<div class="profile-container">
    <div class="blur-blob" style="top: 10%; right: -50px;"></div>
    <div class="blur-blob" style="bottom: 10%; left: -50px; background: rgba(0, 212, 255, 0.1);"></div>

    <div class="profile-card">
        <div class="avatar-circle">
            {{ current_user.name[0] | upper }}
        </div>
        
        <h1 class="profile-name">{{ current_user.name }}</h1>
        <p class="profile-email">{{ current_user.email }}</p>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">ID de Usuario</div>
                <div class="info-value">{{ current_user.id }}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Estado del Sistema</div>
                <div class="info-value" style="color: #4ade80;">● Conectado</div>
            </div>
        </div>

        <div class="profile-actions">
            <a href="{{ url_for('chat') }}" class="btn-action btn-chat">Ir a mis Chats</a>
            <a href="{{ url_for('logout') }}" class="btn-action btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</div>
{% endblock %}

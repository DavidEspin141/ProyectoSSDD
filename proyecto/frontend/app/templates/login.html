{% extends "base.html" %}

{% block custom_style %}
<style>
    /* Mantenemos el fondo del index para coherencia total */
    body {
        background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f0f 100%);
        color: white;
        min-height: 100vh;
    }

    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 160px);
    }

    /* Tarjeta estilo Glassmorphism */
    .form-signin {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(15px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .login-logo {
        font-size: 3rem;
        background: #045eef;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        margin: 0 auto 20px auto;
        box-shadow: 0 0 20px rgba(4, 94, 239, 0.4);
    }

    /* Inputs personalizados */
    .form-floating > .form-control {
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 12px;
    }

    .form-floating > .form-control:focus {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: #045eef;
        box-shadow: 0 0 0 0.25rem rgba(4, 94, 239, 0.25);
        color: white;
    }

    .form-floating > label {
        color: rgba(255, 255, 255, 0.6);
    }

    /* Botón principal */
    .btn-login {
        background-color: #045eef;
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s;
        margin-top: 10px;
    }

    .btn-login:hover {
        background-color: #034acb;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(4, 94, 239, 0.4);
    }

    .error-msg {
        background: rgba(255, 68, 68, 0.1);
        border-left: 4px solid #ff4444;
        color: #ff4444;
        padding: 10px;
        border-radius: 4px;
        margin-top: 20px;
        font-size: 0.9rem;
    }

    /* Links inferiores */
    .login-footer-links {
        margin-top: 20px;
        text-align: center;
        font-size: 0.9rem;
    }

    .login-footer-links a {
        color: #045eef;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <main class="form-signin text-center">
        <form method="POST">
            {{ form.hidden_tag() }}
            
            <div class="login-logo">🦙</div>
            
            <h1 class="h3 mb-3 fw-bold">Bienvenido de nuevo</h1>
            <p class="text-muted mb-4" style="color: rgba(255,255,255,0.6) !important;">
                Ingresa tus credenciales para acceder a <b>LlamaChat</b>
            </p>

            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                <label for="floatingInput">Correo electrónico</label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                <label for="floatingPassword">Contraseña</label>
            </div>

            <div class="checkbox mb-3 text-start">
                <label style="color: rgba(255,255,255,0.7);">
                    <input type="checkbox" name="remember_me" value="remember_me"> Recordar mi sesión
                </label>
            </div>

            <button class="w-100 btn btn-lg btn-primary btn-login" type="submit">Entrar al Sistema</button>

            {% if error %}
                <div class="error-msg">
                    <strong>Error:</strong> {{ error }}
                </div>
            {% endif %}

            <div class="login-footer-links">
                <p style="color: rgba(255,255,255,0.5);">¿No tienes cuenta? <a href="{{ url_for("signup") }}">Regístrate aquí</a></p>
            </div>
        </form>
    </main>
</div>
{% endblock %}
